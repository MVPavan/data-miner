id: classify_one
version: "3"
stage: evaluate
group: null
changelog: |
  v3: reasoning emitted FIRST in the JSON (so scores are conditioned on it,
  not post-hoc rationalisation); FIELD SEMANTICS moved above the JSON schema
  so the anchors shape the score BEFORE the model commits to a value; bucket
  wording cleaned up (0.00-0.29 no longer says "wrong class" — the model has
  already picked a class, that band is "nothing identifiable or box on empty
  space"); bbox_score band descriptions separated into distinct failure
  modes; presence_penalty lowered from 1.3 to 0.2 (the old value penalised
  JSON structural tokens and paraphrased field names).
  v2: independent classification (no proposed-class priming), split
  class_confidence + continuous bbox_score, per-class descriptions from
  class_registry.

system: |
  You are classifying ONE highlighted object in an image.

  Possible classes: {class_list}.

  CLASS DISAMBIGUATION:
  {class_descriptions}

  PER-CLASS DETAILS:
  {per_class_details}

  ANNOTATION RULES:
  {annotation_rules}

  You will be shown the full image. A RED bounding box labelled "TARGET"
  marks the object to classify. Focus ONLY on what is inside that red box.
  Ignore everything else in the scene.

  Decide, based solely on visual evidence inside the TARGET box:
    1. What class the object is, from the list above (or "other" if nothing
       in the list fits).
    2. How confident you are in that class call.
    3. How well the red TARGET bbox fits the object — whether it's a
       reasonable annotation or needs correction.
    4. Whether the object is fully visible (for telemetry only).

  FIELD SEMANTICS (use these anchors when scoring):
    - class_confidence (how sure you are of detected_class):
        0.90-1.00 : certain — visual cues unambiguously match this class
        0.70-0.89 : likely — one dominant hypothesis, minor ambiguity
        0.50-0.69 : plausible — two listed classes fit comparably
        0.30-0.49 : uncertain — cues are weak or contradictory
        0.00-0.29 : nothing identifiable inside the box (empty / blurred /
                    target missing) — pair with detected_class="other"
    - bbox_score (how well the red TARGET box frames the object):
        0.90-1.00 : tight and complete — box matches the object outline
        0.70-0.89 : acceptable — small padding or minor crop at one edge
        0.40-0.69 : LOOSE — box is much larger than the object, or the
                    object is offset inside the box with large empty area
        0.40-0.69 : CROPPED — object significantly extends outside the box
                    (either reading is valid for this band; the band means
                    "bbox needs re-drawing" not unusable)
        0.00-0.39 : unusable — box on empty region / wrong object / object
                    entirely missing inside the box
    - object_complete : telemetry — true if the object is fully visible;
      false if occluded by another object or cropped by the image edge.

  Return EXACTLY one JSON object — no array, no markdown fence, no prose.
  Emit the fields in the order shown so reasoning is committed BEFORE the
  scores (the scores are conditioned on the reasoning, not retrofitted):
  {{
    "reasoning":        "<under 40 words — name the visual cues that
                         decided the class>",
    "detected_class":   "<one of: {class_list}, or \"other\">",
    "class_confidence": 0.0-1.0,
    "bbox_score":       0.0-1.0,
    "object_complete":  true | false
  }}

variables:
  - class_list
  - class_descriptions
  - per_class_details
  - annotation_rules

model_params:
  temperature: 0.0
  max_tokens: 512
  presence_penalty: 0.2
