events {
    worker_connections 4096;
}

http {
    # LLM generation can run long under load; allow large response times.
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # Streaming (SSE) compatibility for OpenAI chat/completions endpoints.
    proxy_buffering    off;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    # least_conn picks the replica with the fewest in-flight requests.
    # Better than round-robin when request latencies vary (long vs short
    # generations). Note: this reduces per-image prefix-cache locality vs
    # a sticky scheme — acceptable for decode-bound workloads.
    upstream qwen35_backend {
        least_conn;
        server qwen35-validator-0:8000 max_fails=3 fail_timeout=30s;
        server qwen35-validator-1:8000 max_fails=3 fail_timeout=30s;
        server qwen35-validator-2:8000 max_fails=3 fail_timeout=30s;
        server qwen35-validator-3:8000 max_fails=3 fail_timeout=30s;
        server qwen35-validator-4:8000 max_fails=3 fail_timeout=30s;
        server qwen35-validator-5:8000 max_fails=3 fail_timeout=30s;
        server qwen35-validator-6:8000 max_fails=3 fail_timeout=30s;
        server qwen35-validator-7:8000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;

        location /health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://qwen35_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
