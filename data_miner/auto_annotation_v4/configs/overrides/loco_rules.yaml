# LOCO-specific filter overrides.
#
# Applied on top of the base config when running the
# loco_unannotated_full_sam_filtered_detect job:
#
#   python -u -m data_miner.auto_annotation_v4 \
#       --config data_miner/auto_annotation_v4/configs/overrides/loco_rules.yaml \
#       runtime.image_dir=/media/data_2/datasets/datasets_pavan/loco_unannotated_full_sam_filtered \
#       runtime.job_id=loco_unannotated_full_sam_filtered_detect \
#       'runtime.stages=[filter,evaluate,finalize]' \
#       'runtime.force_stages=[filter]' ...
#
# These flags are off by default on default.yaml so other jobs (fl_pj, LAION)
# are unaffected.

auto_accept:
  # Head+person co-existence shortcut: if a head is contained in a person
  # bbox above filtering.head_person_containment_min (below), BOTH candidates
  # auto-accept provided their scores also clear head_person_coexistence_min_score.
  # The spatial reinforcement alone isn't enough — a weak head riding any
  # spurious person box would otherwise get a free pass to VLM-free accept.
  # 0.60 sits comfortably above the sam3_dart 0.50 per-model floor, so both
  # legs must be meaningfully confident.
  head_person_coexistence: true
  head_person_coexistence_min_score: 0.60

filtering:
  # Single-detector run: only sam3_dart proposals are considered. grounding_dino
  # ran during detect but its candidates are dropped at the source_model step
  # (matches the previous LOCO config.yaml).
  allowed_source_models:
    - sam3_dart

  # Per-head containment check. For each class_name=head candidate, compute
  # containment = intersection(head, person) / area(head) across all persons
  # in the image; drop the head if its max containment is below this threshold.
  # Analysis on LOCO showed a bimodal split: 92% of heads have containment
  # >= 0.9 (legitimately inside a person), 6% have < 0.1 (orphans), only ~2%
  # in the middle. Threshold 0.3 is safely in the gap — catches all clear
  # orphans without risking legitimate heads.
  # Supersedes the coarser `reject_head_without_person` presence check.
  head_person_containment_min: 0.3

  # Strict class-agnostic NMS after dedup + cross_class. Respects the four
  # overlap_exempt classes (person, head, backpack, handbag) so small-inside-
  # big co-occurrences stay intact. Confusion pairs
  # (forklift<->palletjack<->shopping cart<->truck, luggage, electronics,
  # road_vehicle) are NMS'd instead of flagged, so VLM sees one survivor per
  # spatial region rather than both.
  class_agnostic_nms:
    enabled: true
    threshold: 0.7
    respect_overlap_exempt: true
    suppress_confusion_pairs: true

  # Per-class min_area overrides. The global 0.0005 (≈32x32 px on 1920x1080)
  # culls 27% of heads, 11% of cellphones, 8% of handbags in LOCO pre-filter.
  # Lower the floor for naturally-small classes; everything else keeps the
  # global 0.0005.
  per_class_min_area:
    # 0 disables the area floor entirely for heads — LOCO head annotations
    # include many tiny far-field heads that would otherwise be culled at
    # the global 0.0005 (≈32x32 px) floor.
    head:      0
    cellphone: 0.00005   # ≈10x10 px on 1920x1080
    wallet:    0.00005
    bird:      0.0001
    cat:       0.0001
    dog:       0.0001
    handbag:   0.0002    # ≈20x20 px

# Evaluate-stage tuning. Tighter than the default 0.3/0.5 because LOCO has
# a lot of tier-3 industrial confusion pairs (forklift/palletjack/shopping-
# cart/truck) and we want the VLM to be *confident* before auto-accepting.
# Bbox axis tuned independently so a class-correct but loose-bbox call
# goes to human review instead of silently accepting a bad annotation.
evaluate:
  reject_below: 0.4          # class_conf < 0.4 → reject (was 0.3)
  accept_above: 0.7          # class_conf ≥ 0.7 → trusted (was 0.5)
  bbox_reject_below: 0.4     # bbox < 0.4 (with class trusted) → reject
  bbox_accept_above: 0.7     # bbox ≥ 0.7 → accepted; [0.4,0.7) → review
  vlm_image:
    format: JPEG
    max_size: 1280
    quality: 90
