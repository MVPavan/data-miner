source:
  package: data_miner.auto_annotation
  path: data_miner/auto_annotation/prompts.py
  symbol: build_verification_prompt
  reason: Early compact candidate-verification prompt with useful action schema.

prompt: |
  You are validating one candidate annotation.
  Expected class: {class_name}.
  Known synonyms: {synonyms}.
  Hard negatives: {negatives}.
  Current label: {candidate_label}.
  Current source model: {candidate_source_model}.
  Return JSON only with:
  {
    "semantic_match": "yes|no|uncertain",
    "bbox_tight": "tight|loose|too_small|uncertain",
    "recommended_action": "accept|relabel|refine|reject|escalate",
    "confidence_band": "high|medium|low",
    "rationale_short": "...",
    "relabel_to": "optional",
    "target_model": "optional",
    "retry_expression": "optional",
    "next_stage": "proposal|refinement|escalation|none"
  }