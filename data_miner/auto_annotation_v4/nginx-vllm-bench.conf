events { worker_connections 4096; }
http {
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    proxy_buffering    off;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    # Single-backend config for solo-replica benching (docker compose up -d
    # --no-deps qwen35-lb with just qwen35-validator-0 running).
    upstream qwen35_backend {
        server qwen35-validator-0:8000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        location /health { access_log off; return 200 "ok\n"; }
        location / {
            proxy_pass http://qwen35_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
