# CVAT stack for manual_reviewer_cvat.
#
# Mostly mirrors the upstream cvat-ai/cvat docker-compose layout but renamed,
# re-ported, and pinned. This file is intentionally self-contained — you can
# `docker compose -f docker-compose.cvat.yml up -d` without pulling the
# upstream repo. Image pin is set conservatively; bump after a successful
# smoke-test pass.
#
# Bring up:  ./scripts/manage_cvat.sh start
# Tear down: ./scripts/manage_cvat.sh stop
#
# Notes:
# - The default upstream compose splits services across multiple files
#   (compose.yml + compose.dev.yml + compose.https.yml). For a 5-user on-prem
#   deployment we collapse to one file with the production image and HTTP only.
# - Nuclio (serverless ML functions) is OMITTED — we don't need CVAT's smart
#   tools for this project. Add later by appending the cvat/cvat#nuclio block.
# - ClickHouse + Vector (analytics) are OMITTED for the same reason — adds
#   ~1GB RAM with no benefit at 5 reviewers.

x-backend-env: &backend-env
  DJANGO_MODWSGI_EXTRA_ARGS: ""
  ALLOWED_HOSTS: "*"
  CVAT_REDIS_INMEM_HOST: cvat_redis_inmem
  CVAT_REDIS_INMEM_PORT: 6379
  CVAT_REDIS_ONDISK_HOST: cvat_redis_ondisk
  CVAT_REDIS_ONDISK_PORT: 6666
  CVAT_POSTGRES_HOST: cvat_db
  CVAT_POSTGRES_USER: root
  CVAT_POSTGRES_DBNAME: cvat
  CVAT_POSTGRES_PASSWORD: ""
  ADAPTIVE_AUTO_ANNOTATION: "false"
  IAM_OPA_BUNDLE: "1"
  no_proxy: "clickhouse,grafana,vector,nuclio,opa,${no_proxy:-}"
  NUMPROCS: 2

services:

  cvat_db:
    container_name: cvat_db_review
    image: postgres:16.3-alpine
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: cvat
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - cvat_db:/var/lib/postgresql/data
    ports:
      - "${CVAT_POSTGRES_HOST_PORT:-5433}:5432"

  cvat_redis_inmem:
    container_name: cvat_redis_inmem_review
    image: redis:7.2.3-alpine
    restart: always
    command: ["redis-server", "--save", "60", "100", "--appendonly", "yes"]
    volumes:
      - cvat_inmem_data:/data

  cvat_redis_ondisk:
    container_name: cvat_redis_ondisk_review
    image: aerospike/aerospike-server-enterprise:7.0.0.2
    restart: always
    command:
      - "--config-file"
      - "/run/secrets/aerospike.conf"
    secrets:
      - source: aerospike_conf
        target: /run/secrets/aerospike.conf
    volumes:
      - cvat_cache_db:/var/lib/aerospike

  cvat_opa:
    container_name: cvat_opa_review
    image: openpolicyagent/opa:0.63.0
    restart: always
    command:
      - run
      - --server
      - --addr
      - :8181
      - --set=decision_logs.console=true
      - --set=services.cvat.url=http://cvat_server:8080
      - --set=bundles.cvat.service=cvat
      - --set=bundles.cvat.resource=/api/auth/rules
      - --set=bundles.cvat.polling.min_delay_seconds=5
      - --set=bundles.cvat.polling.max_delay_seconds=15

  cvat_server:
    container_name: cvat_server_review
    image: cvat/server:v2.18.0
    restart: always
    depends_on:
      - cvat_db
      - cvat_redis_inmem
      - cvat_redis_ondisk
      - cvat_opa
    environment:
      <<: *backend-env
      DJANGO_LOG_SERVER_HOST: cvat_server
      DJANGO_LOG_SERVER_PORT: 8282
      CVAT_BASE_URL: ""
      ONE_RUNNING_JOB_IN_QUEUE_PER_USER: "true"
    command: -c supervisord/server.conf
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - "${CVAT_SHARE_PATH:-/tmp/cvat_share_unset}:/home/django/share:ro"

  cvat_utils:
    container_name: cvat_utils_review
    image: cvat/server:v2.18.0
    restart: always
    depends_on:
      - cvat_db
      - cvat_redis_inmem
      - cvat_redis_ondisk
      - cvat_opa
    environment:
      <<: *backend-env
      NUMPROCS: 1
    command: -c supervisord/utils.conf
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs

  cvat_worker_import:
    container_name: cvat_worker_import_review
    image: cvat/server:v2.18.0
    restart: always
    depends_on: [cvat_db, cvat_redis_inmem, cvat_redis_ondisk, cvat_opa]
    environment:
      <<: *backend-env
      NUMPROCS: 2
    command: -c supervisord/worker.import.conf
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
      - "${CVAT_SHARE_PATH:-/tmp/cvat_share_unset}:/home/django/share:ro"

  cvat_worker_export:
    container_name: cvat_worker_export_review
    image: cvat/server:v2.18.0
    restart: always
    depends_on: [cvat_db, cvat_redis_inmem, cvat_redis_ondisk, cvat_opa]
    environment:
      <<: *backend-env
      NUMPROCS: 2
    command: -c supervisord/worker.export.conf
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs

  cvat_worker_annotation:
    container_name: cvat_worker_annotation_review
    image: cvat/server:v2.18.0
    restart: always
    depends_on: [cvat_db, cvat_redis_inmem, cvat_redis_ondisk, cvat_opa]
    environment:
      <<: *backend-env
      NUMPROCS: 1
    command: -c supervisord/worker.annotation.conf
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs

  cvat_ui:
    container_name: cvat_ui_review
    image: cvat/ui:v2.18.0
    restart: always
    depends_on: [cvat_server]

  traefik:
    container_name: cvat_traefik_review
    image: traefik:v2.11
    restart: always
    command:
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=cvat_review_default"
      - "--entryPoints.web.address=:8080"
      - "--api.insecure=false"
    ports:
      - "${CVAT_HOST_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cvat-server.rule=PathPrefix(`/api/`) || PathPrefix(`/static/`) || PathPrefix(`/admin`) || PathPrefix(`/django-rq`)"
      - "traefik.http.routers.cvat-server.entrypoints=web"
      - "traefik.http.routers.cvat-server.service=cvat-server"
      - "traefik.http.services.cvat-server.loadbalancer.server.port=8080"
      - "traefik.http.routers.cvat-ui.rule=PathPrefix(`/`)"
      - "traefik.http.routers.cvat-ui.entrypoints=web"
      - "traefik.http.routers.cvat-ui.service=cvat-ui"
      - "traefik.http.services.cvat-ui.loadbalancer.server.port=80"

volumes:
  cvat_db:
  cvat_data:
  cvat_keys:
  cvat_logs:
  cvat_inmem_data:
  cvat_cache_db:

secrets:
  aerospike_conf:
    file: ./configs/aerospike.conf
