# Minimal Aerospike config for cvat_redis_ondisk service.
# Copied from upstream cvat-ai/cvat compose secrets (Apache-2.0).
# Single-node, default ports, in-memory + on-disk namespace for chunk cache.

service {
    cluster-name cvat
    proto-fd-max 15000
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 6666
    }
    heartbeat {
        mode mesh
        port 3002
        interval 150
        timeout 10
    }
    fabric { port 3001 }
    info   { port 3003 }
}

namespace cvat {
    replication-factor 1
    nsup-period 60
    storage-engine memory {
        data-size 1G
    }
}
